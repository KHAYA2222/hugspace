name: hugspace
description: A warm anonymous space to share feelings and receive hugs.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0

  # UI & Animations
  google_fonts: ^8.1.0
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0

  # Utils
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  timeago: ^3.6.0
  firebase_auth: ^6.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/animations/
